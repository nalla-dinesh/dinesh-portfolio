name: Bug report
description: Report a problem with the portfolio or profile assets
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / device / OS
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
