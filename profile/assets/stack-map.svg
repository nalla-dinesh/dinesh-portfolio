<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">End-to-end capability map</title><desc id="desc">Frontend, mobile, backend, servers and data, and agentic AI connected as one delivery path.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.flow{stroke-dasharray:8 10;animation:flow 5s linear infinite}.box{animation:box 4s ease-in-out infinite}.b2{animation-delay:.4s}.b3{animation-delay:.8s}.b4{animation-delay:1.2s}.b5{animation-delay:1.6s}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes box{0%,100%{opacity:.82}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.flow,.box{animation:none}}</style>
<rect width="1200" height="300" rx="16" fill="#0b0e0d"/><text x="48" y="58" fill="#7fd4c1" font-size="15" letter-spacing="3">CAPABILITY MAP / ONE BUILDER, END-TO-END</text>
<path class="flow" d="M230 160H970" stroke="#c43b32" stroke-width="3" fill="none"/>
<g font-size="16" font-weight="700" text-anchor="middle">
 <g class="box"><rect x="48" y="100" width="182" height="120" rx="8" fill="#121614" stroke="#e8c85a" stroke-width="2"/><text x="139" y="140" fill="#e8c85a">FRONTEND</text><text x="139" y="170" fill="#9a9f96" font-size="12" font-weight="400">React / TS / Three.js</text></g>
 <g class="box b2"><rect x="270" y="100" width="182" height="120" rx="8" fill="#121614" stroke="#7fd4c1" stroke-width="2"/><text x="361" y="140" fill="#7fd4c1">MOBILE</text><text x="361" y="170" fill="#9a9f96" font-size="12" font-weight="400">Flutter / Kotlin</text></g>
 <g class="box b3"><rect x="492" y="100" width="182" height="120" rx="8" fill="#121614" stroke="#9ad0ff" stroke-width="2"/><text x="583" y="140" fill="#9ad0ff">BACKEND</text><text x="583" y="170" fill="#9a9f96" font-size="12" font-weight="400">FastAPI / REST / Auth</text></g>
 <g class="box b4"><rect x="714" y="100" width="182" height="120" rx="8" fill="#121614" stroke="#b7f397" stroke-width="2"/><text x="805" y="140" fill="#b7f397">SERVERS / DATA</text><text x="805" y="170" fill="#9a9f96" font-size="12" font-weight="400">Postgres / Redis / Docker</text></g>
 <g class="box b5"><rect x="936" y="100" width="216" height="120" rx="8" fill="#121614" stroke="#c43b32" stroke-width="2"/><text x="1044" y="140" fill="#ece3cd">AGENTIC AI</text><text x="1044" y="170" fill="#9a9f96" font-size="12" font-weight="400">LangGraph / RAG / Eval</text></g>
</g>
<text x="48" y="262" fill="#9a9f96" font-size="13" letter-spacing="1">THE GOAL IS NOT “EVERY TOOL”. THE GOAL IS CONNECTING THE LAYERS AND SHIPPING THE SYSTEM.</text>
</svg>